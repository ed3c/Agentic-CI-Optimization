name: aco-tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-independent-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install in independent consumer mode
        run: python -m pip install .
      - name: Unit and external-directory CLI tests
        run: python -m unittest discover -s tests -v
